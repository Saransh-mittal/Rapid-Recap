<div id="splash-screen" aria-label="Loading screen">
  <div class="particles-background"></div>

  <div class="splash-content">
    <div class="logo-container">
      <div class="logo-orbit">
        <div class="orbit-particle p1"></div>
        <div class="orbit-particle p2"></div>
        <div class="orbit-particle p3"></div>
      </div>
      <img src="/images/rrlogo_512.png" alt="Rapid Recap Logo" class="logo" />
    </div>

    <h1 class="title">"The Game That Builds Minds" 🎮💡</h1>
    <p class="subtitle">Beat the Clock, Beat Your Rivals!</p>

    <div class="loading-bar-container">
      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>
      <p class="loading-text">Preparing your next challenge...</p>
    </div>
  </div>

  <div class="floating-elements">
    <div class="floating-element quiz-icon">❓</div>
    <div class="floating-element trophy-icon">🏆</div>
    <div class="floating-element brain-icon">🧠</div>
    <div class="floating-element lightning-icon">⚡</div>
    <div class="floating-element star-icon">⭐</div>
  </div>
</div>

<script>
// Create particles for the background
document.addEventListener('DOMContentLoaded', function() {
  const particlesContainer = document.querySelector('.particles-background');

  // Create particles
  for (let i = 0; i < 60; i++) {
    const particle = document.createElement('div');
    particle.classList.add('particle');

    // Random properties
    const size = Math.random() * 3 + 1;
    const posX = Math.random() * 100;
    const posY = Math.random() * 100;
    const opacity = Math.random() * 0.5 + 0.1;
    const animDuration = Math.random() * 20 + 10;
    const animDelay = Math.random() * 5;

    // Apply styles
    particle.style.cssText = `
      position: absolute;
      left: ${posX}%;
      top: ${posY}%;
      width: ${size}px;
      height: ${size}px;
      background-color: white;
      border-radius: 50%;
      opacity: ${opacity};
      animation: twinkle ${animDuration}s infinite ease-in-out ${animDelay}s;
    `;

    particlesContainer.appendChild(particle);
  }
});

// Animation for particles
const styleSheet = document.createElement('style');
styleSheet.textContent = `
  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.2); }
  }
`;
document.head.appendChild(styleSheet);
</script>
