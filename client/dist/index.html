  <style>
    /* Splash screen styles */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;

    }

      flex-direction: column;
      align-items: center;
    }

    #splash-screen .logo {
      width: 120px;
      height: auto;
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }

    #splash-screen .title {
      font-size: 28px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 2px;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.2s forwards;
    }

    #splash-screen .subtitle {
      font-size: 16px;
      font-weight: 300;
      color: #b3b3b3;
      letter-spacing: 1px;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.5s forwards;
    }

    /* Animations */
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
