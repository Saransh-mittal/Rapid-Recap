<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <meta name="robots" content="index, follow">
  <meta name="author" content="Rapid Recap">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Rapid Recap">
  <meta name="apple-mobile-web-app-title" content="Rapid Recap">
  <meta name="theme-color" content="#1A1527">
  <meta name="msapplication-navbutton-color" content="#1A1527">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="msapplication-starturl" content="/">

  <!-- Resource Hints - Preconnect to important domains -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://rapidrecap.ai" crossorigin>

  <!-- DNS prefetch -->
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">

  <!-- Critical Resources Preload - high priority assets required for initial render -->
  <link rel="preload" href="/src/entry-client.jsx" as="script" fetchpriority="high">
  <link rel="preload" href="/styles/components/css-splash.css" as="style">
  <link rel="preload" href="/styles/main.css" as="style">
  <link rel="preload" href="/images/rrlogo_512.png" as="image" fetchpriority="high">
  <link rel="preload" href="/images/rrlogo.webp" as="image" fetchpriority="high">

  <!-- Secondary Resources Preload - important but can load after initial render -->
  <link rel="preload" href="/src/redux/store.js" as="script">
  <link rel="preload" href="/src/i18n.jsx" as="script">

  <!-- Module Preloads - modern browsers optimizations -->
  <link rel="modulepreload" href="/src/App.jsx">
  <link rel="modulepreload" href="/src/contextAPI/SocketContext.jsx">
  <link rel="modulepreload" href="/src/contextAPI/NavbarContext.jsx">

  <!-- Progressive Web App -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/images/rrlogo_512.png">
  <link rel="icon" type="image/webp" href="/images/rrlogo.webp">


  <!-- Add to index.html -->

      },
      "mainEntity": {
        "@type": "LearningResource",
        "learningResourceType": "Quiz Collection",
        "educationalLevel": "All Levels",
        "teaches": ["Current Affairs", "General Knowledge", "Competitive Exam Preparation"]
      }
    }, {
      "@type": "WebPage",
      "name": "Tournament Arena",
      "url": "https://rapidrecap.ai/tournament",
      "description": "Participate in weekend GK tournaments, compete with other learners, and win rewards. Test your knowledge in various categories through AI-powered competitive quizzes.",
      "potentialAction": {
        "@type": "PlayAction",
        "target": "https://rapidrecap.ai/tournament"
      },
      "mainEntity": {
        "@type": "Game",
        "gameType": "Knowledge Competition",
        "playMode": "Online multiplayer",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        }
      }
    }, {
      "@type": "WebPage",
      "name": "Leaderboard",
      "url": "https://rapidrecap.ai/leaderboard",
      "description": "View real-time rankings of top performers, track your position, and compare your progress with other learners. See who's leading in general knowledge mastery.",
      "potentialAction": {
        "@type": "ViewAction",
        "target": "https://rapidrecap.ai/leaderboard"
      },
      "mainEntity": {
        "@type": "ItemList",
        "itemListElement": {
          "@type": "ListItem",
          "item": {
            "@type": "Thing",
            "name": "Global Leaderboard Rankings",
            "description": "Real-time performance rankings of Rapid Recap users"
          }
        }
      }
    }],
    "publisher": {
      "@type": "Organization",
      "name": "Rapid Recap",
      "url": "https://rapidrecap.ai",
      "logo": {
        "@type": "ImageObject",
        "url": "https://rapidrecap.ai/images/rrlogo_512.png"
      }
    },
    "audience": {
      "@type": "Audience",
      "audienceType": "Students, Professionals, Knowledge Enthusiasts",
      "geographicArea": {
        "@type": "Country",
        "name": "India"
      }
    }
  }
  </script>

  <!-- Additional structured data omitted for brevity -->
  <style>
    #splash-screen {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, #1A1527 0%, #2D1B4E 60%, #4A2E69 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    font-family: 'Exo 2', sans-serif;
    overflow: hidden;
  }

  /* Particle background */
  .particles-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .splash-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    max-width: 90%;
    z-index: 2;
  }

  .logo-container {
    position: relative;
    margin-bottom: 2rem;
    perspective: 1000px;
  }

  .logo-orbit {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    animation: rotate3d 10s linear infinite;
  }

  .orbit-particle {
    position: absolute;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ED64A6, #805AD5);
    box-shadow: 0 0 15px rgba(237, 100, 166, 0.7);
  }

  .orbit-particle.p1 {
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    animation: pulseParticle 2s infinite alternate;
  }

  .orbit-particle.p2 {
    bottom: 30%;
    left: 0;
    animation: pulseParticle 2s infinite alternate 0.6s;
  }

  .orbit-particle.p3 {
    bottom: 30%;
    right: 0;
    animation: pulseParticle 2s infinite alternate 1.2s;
  }

  .logo {
    width: 90px;
    height: auto;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 0 20px rgba(237, 100, 166, 0.4));
    animation: floatLogo 4s infinite ease-in-out;
  }

  .title {
    font-size: clamp(1.75rem, 4vw, 2.5rem);
    font-weight: 700;
    background: linear-gradient(135deg, #ED64A6, #805AD5, #4299E1);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.75rem;
    text-align: center;
    letter-spacing: 1px;
    opacity: 0;
    animation: fadeIn 0.8s ease-out 0.3s forwards;
  }

  .subtitle {
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    font-weight: 500;
    color: rgba(255, 255, 255, 0.9);
    letter-spacing: 1px;
    text-align: center;
    margin-bottom: 2rem;
    opacity: 0;
    animation: fadeIn 0.8s ease-out 0.6s forwards;
  }

  /* Loading bar */
  .loading-bar-container {
    width: 80%;
    max-width: 300px;
    margin-top: 1rem;
    opacity: 0;
    animation: fadeIn 0.8s ease-out 0.9s forwards;
  }

  .loading-bar {
    height: 8px;
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 10px rgba(80, 50, 140, 0.5);
  }

  .loading-progress {
    height: 100%;
    background: linear-gradient(90deg, #ED64A6, #805AD5, #4299E1);
    background-size: 200% 100%;
    border-radius: 4px;
    animation: loadingProgress 5s ease-in-out forwards, shimmer 2s infinite;
    width: 0%;
  }

  .loading-text {
    font-size: 0.875rem;
    color: rgba(255, 255, 255, 0.7);
    text-align: center;
    margin-top: 0.5rem;
    letter-spacing: 0.5px;
  }

  /* Floating elements */
  .floating-elements {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .floating-element {
    position: absolute;
    font-size: 24px;
    opacity: 0.4;
    filter: blur(0.5px);
    animation-name: float;
    animation-duration: 6s;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-direction: alternate;
  }

  .quiz-icon {
    top: 20%;
    left: 15%;
    animation-delay: 0s;
  }

  .trophy-icon {
    top: 35%;
    right: 20%;
    animation-delay: 1s;
  }

  .brain-icon {
    bottom: 30%;
    left: 25%;
    animation-delay: 2s;
  }

  .lightning-icon {
    bottom: 40%;
    right: 15%;
    animation-delay: 1.5s;
  }

  .star-icon {
    top: 60%;
    left: 65%;
    animation-delay: 0.5s;
  }

  /* Animations */
  @keyframes floatLogo {
    0%, 100% { transform: translateY(0) rotate(0); }
    25% { transform: translateY(-5px) rotate(2deg); }
    75% { transform: translateY(5px) rotate(-2deg); }
  }

  @keyframes rotate3d {
    0% { transform: translate(-50%, -50%) rotateX(60deg) rotateZ(0); }
    100% { transform: translate(-50%, -50%) rotateX(60deg) rotateZ(360deg); }
  }

  @keyframes pulseParticle {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.2); opacity: 1; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes loadingProgress {
    0% { width: 0%; }
    15% { width: 20%; }
    30% { width: 40%; }
    50% { width: 60%; }
    75% { width: 80%; }
    100% { width: 100%; }
  }

  @keyframes shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: 0 0; }
  }

  @keyframes float {
    0% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-20px) rotate(5deg); }
    100% { transform: translateY(0) rotate(0); }
  }

  @media (max-width: 480px) {
    .logo { width: 100px; }
    .logo-orbit { width: 160px; height: 160px; }
    .orbit-particle { width: 10px; height: 10px; }
  }

  </style>
</head>

<body>
  <!-- Main Content -->
  <main id="main-content">
    <!-- Loading Screen -->
    <div id="splash-screen" aria-label="Loading screen">
    </div>
    <!-- React Root -->
    <div id="root"><!--ssr-outlet--></div>
  </main>

  <!-- NoScript Fallback -->
  <noscript>
    <div style="text-align: center; padding: 20px;">
      Please enable JavaScript to access our AI-powered GK quiz platform. We offer interactive learning experiences that require JavaScript to function.
    </div>
  </noscript>

  <!-- Entry Point with high priority loading -->
  <script type="module" src="/src/entry-client.jsx" fetchpriority="high"></script>
</body>
</html>
