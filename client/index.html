<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <meta name="robots" content="index, follow">
  <meta name="author" content="Rapid Recap">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Rapid Recap">
  <meta name="apple-mobile-web-app-title" content="Rapid Recap">
  <meta name="theme-color" content="#1A1527">
  <meta name="msapplication-navbutton-color" content="#1A1527">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="msapplication-starturl" content="/">

  <!-- Resource Hints - Preconnect to important domains -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://rapidrecap.ai" crossorigin>

  <!-- DNS prefetch -->
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <!-- 🚀 OPTIMIZATION: Add DNS prefetch for Microsoft Clarity -->
  <link rel="dns-prefetch" href="https://www.clarity.ms">

  <!-- Critical Resources Preload - high priority assets required for initial render -->
  <link rel="preload" href="/src/entry-client.jsx" as="script" fetchpriority="high">
  <link rel="stylesheet" href="/styles/components/css-splash.css">
  <link rel="preload" href="/styles/main.css" as="style">
  <link rel="preload" href="/images/rrlogo_512.png" as="image" fetchpriority="high">
  <link rel="preload" href="/images/rrlogo.webp" as="image" fetchpriority="high">

  <!-- 🔥 CRITICAL OPTIMIZATION: Preload bundled translation files -->
  <link rel="preload" href="/locales/bundled/en/all.json" as="fetch" crossorigin fetchpriority="high">
  <link rel="preload" href="/locales/bundled/hi/all.json" as="fetch" crossorigin>

  <!-- Microsoft Clarity - keeping in head as requested -->
  <script type="text/javascript">
    (function (c, l, a, r, i, t, y) {
      c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
      t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
      y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
    })(window, document, "clarity", "script", "sd2t5c3mee");
  </script>

  <!-- Secondary Resources Preload - important but can load after initial render -->
  <link rel="preload" href="/src/redux/store.js" as="script">
  <!-- Note: Module preloading is handled automatically by Vite for dynamic imports -->

  <!-- Progressive Web App -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/images/rrlogo_512.png">
  <link rel="icon" type="image/webp" href="/images/rrlogo.webp">

  <!-- Add to index.html -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "url": "https://rapidrecap.ai",
    "name": "Rapid Recap",
    "subjectOf": [{
      "@type": "WebPage",
      "name": "Home Dashboard",
      "url": "https://rapidrecap.ai/home",
      "description": "Access daily AI-curated GK questions, current affairs quizzes, and personalized learning content. Stay updated with the latest general knowledge in an interactive format.",
      "potentialAction": {
        "@type": "ReadAction",
        "target": "https://rapidrecap.ai/home"
      },
      "mainEntity": {
        "@type": "LearningResource",
        "learningResourceType": "Quiz Collection",
        "educationalLevel": "All Levels",
        "teaches": ["Current Affairs", "General Knowledge", "Competitive Exam Preparation"]
      }
    }, {
      "@type": "WebPage",
      "name": "Tournament Arena",
      "url": "https://rapidrecap.ai/tournament",
      "description": "Participate in weekend GK tournaments, compete with other learners, and win rewards. Test your knowledge in various categories through AI-powered competitive quizzes.",
      "potentialAction": {
        "@type": "PlayAction",
        "target": "https://rapidrecap.ai/tournament"
      },
      "mainEntity": {
        "@type": "Game",
        "gameType": "Knowledge Competition",
        "playMode": "Online multiplayer",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        }
      }
    }, {
      "@type": "WebPage",
      "name": "Leaderboard",
      "url": "https://rapidrecap.ai/leaderboard",
      "description": "View real-time rankings of top performers, track your position, and compare your progress with other learners. See who's leading in general knowledge mastery.",
      "potentialAction": {
        "@type": "ViewAction",
        "target": "https://rapidrecap.ai/leaderboard"
      },
      "mainEntity": {
        "@type": "ItemList",
        "itemListElement": {
          "@type": "ListItem",
          "item": {
            "@type": "Thing",
            "name": "Global Leaderboard Rankings",
            "description": "Real-time performance rankings of Rapid Recap users"
          }
        }
      }
    }],
    "publisher": {
      "@type": "Organization",
      "name": "Rapid Recap",
      "url": "https://rapidrecap.ai",
      "logo": {
        "@type": "ImageObject",
        "url": "https://rapidrecap.ai/images/rrlogo_512.png"
      }
    },
    "audience": {
      "@type": "Audience",
      "audienceType": "Students, Professionals, Knowledge Enthusiasts",
      "geographicArea": {
        "@type": "Country",
        "name": "India"
      }
    }
  }
  </script>
</head>

<body>
  <!-- Main Content -->
  <main id="main-content">
    <!-- Loading Screen -->
    <div id="splash-screen" aria-label="Loading screen">
      <div class="stars"></div>

      <div class="floating-elements">
        <div class="floating-element quiz-icon">?</div>
        <div class="floating-element trophy-icon">🏆</div>
        <div class="floating-element brain-icon">🧠</div>
        <div class="floating-element lightning-icon">⚡</div>
        <div class="floating-element star-icon">⭐</div>
      </div>

      <div class="splash-content">
        <div class="logo-container">
          <div class="glow-effect"></div>
          <img src="/images/rrlogo_512.png" alt="Rapid Recap Logo" class="logo">
        </div>

        <h1 class="title">Rapid Recap</h1>
        <p class="subtitle">"The Game That Builds Minds" 🎮💡</p>

        <div class="loading-bar-container">
          <div class="loading-bar">
            <div class="loading-progress" id="splash-progress"></div>
          </div>
          <p class="loading-text" id="splash-text">Initializing Game Engine...</p>
        </div>
      </div>
    </div>

    <script data-cfasync="false">
      // Simulate initial progress
      const progressBar = document.getElementById('splash-progress');
      const progressText = document.getElementById('splash-text');
      const splashScreen = document.getElementById('splash-screen');

      let progress = 10;
      const interval = setInterval(() => {
        if (progress < 90) {
          progress += Math.random() * 5;
          if (progressBar) progressBar.style.width = `${Math.min(progress, 90)}%`;
        }
      }, 200);

      // Function to be called by React when ready
      window.finishLoading = () => {
        clearInterval(interval);
        if (progressBar) progressBar.style.width = '100%';
        if (progressText) progressText.textContent = 'Ready to Battle!';

        setTimeout(() => {
          if (splashScreen) {
            splashScreen.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
            splashScreen.style.opacity = '0';
            splashScreen.style.pointerEvents = 'none';
            splashScreen.style.transform = 'scale(1.05)';

            setTimeout(() => {
              splashScreen.style.display = 'none';
            }, 500);
          }
        }, 800);
      };

      // Safety timeout: if app doesn't load in 8s, force hide
      setTimeout(() => {
        if (window.finishLoading) window.finishLoading();
      }, 8000);
    </script>
    <!-- React Root -->
    <div id="root"><!--ssr-outlet--></div>
  </main>

  <!-- NoScript Fallback -->
  <noscript>
    <div style="text-align: center; padding: 20px;">
      Please enable JavaScript to access our AI-powered GK quiz platform. We offer interactive learning experiences that
      require JavaScript to function.
    </div>
  </noscript>

  <!-- Entry Point with high priority loading -->
  <script type="module" src="/src/entry-client.jsx" fetchpriority="high"></script>
</body>

</html>
