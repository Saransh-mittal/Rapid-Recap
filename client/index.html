<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapid Recap - Stay Informed, Stay Ahead</title>

  <!-- Preload resources -->
  <link rel="preload" href="/src/assets/hero/hero-bg.webp" as="image">
  <link rel="preload" href="/images/tourBGDark.webp" as="image">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/images/rrlogo_512.png">
  <meta name="theme-color" content="#1a1527">
  <link rel="icon" type="image/webp" href="/images/rrlogo_512.png">

  <!-- Font preconnect -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- Splash screen styles -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap');

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #splash-screen .logo {
      width: 120px;
      height: auto;
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }

    #splash-screen .title {
      font-family: 'Poppins', sans-serif;
      font-size: 28px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 2px;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.2s forwards;
    }

    #splash-screen .subtitle {
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      font-weight: 300;
      color: #b3b3b3;
      letter-spacing: 1px;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.5s forwards;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-content">
      <img src="/images/rrlogo_512.png" alt="Rapid Recap Logo" class="logo" />
      <div class="title">RAPID RECAP</div>
      <div class="subtitle">Stay Informed, Stay Ahead</div>
    </div>
  </div>

  <!-- App Root -->
  <div id="root"><!--ssr-outlet--></div>

  <!-- Entry Point -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
