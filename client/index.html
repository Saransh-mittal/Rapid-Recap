<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/Rapid Recap.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Rapid Recap - Your Source for News and Quizzes</title>
    <meta
      name="title"
      content="Rapid Recap - Your Source for News and Quizzes"
    />
    <meta
      name="description"
      content="Stay updated with the latest news and test your knowledge with quizzes on Rapid Recap. Earn your Information Quotient (IQ) score and see where you rank!"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.rapidrecap.com/" />
    <meta
      property="og:title"
      content="Rapid Recap - Your Source for News and Quizzes"
    />
    <meta
      property="og:description"
      content="Stay updated with the latest news and test your knowledge with quizzes on Rapid Recap. Earn your Information Quotient (IQ) score and see where you rank!"
    />
    <meta
      property="og:image"
      content="https://www.rapidrecap.com/images/RapidRecapPreview.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.rapidrecap.com/" />
    <meta
      property="twitter:title"
      content="Rapid Recap - Your Source for News and Quizzes"
    />
    <meta
      property="twitter:description"
      content="Stay updated with the latest news and test your knowledge with quizzes on Rapid Recap. Earn your Information Quotient (IQ) score and see where you rank!"
    />
    <meta
      property="twitter:image"
      content="https://www.rapidrecap.com/images/RapidRecapPreview.png"
    />

    <!-- Additional Meta Tags -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Rapid Recap Team" />
    <meta
      name="keywords"
      content="news, quizzes, Information Quotient, IQ, leaderboard, Rapid Recap"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://www.rapidrecap.com/",
        "name": "Rapid Recap",
        "description": "Stay updated with the latest news and test your knowledge with quizzes on Rapid Recap. Earn your Information Quotient (IQ) score and see where you rank!",
        "publisher": {
          "@type": "Organization",
          "name": "Rapid Recap"
        },
        "image": {
          "@type": "ImageObject",
          "url": "https://www.rapidrecap.com/images/RapidRecapPreview.png",
          "width": 1200,
          "height": 630
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="overlay"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
